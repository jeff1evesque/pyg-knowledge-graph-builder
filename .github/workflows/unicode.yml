name: unicode

##
## Push is scoped to the default branch. With a bare `push:` beside
## `pull_request:`, every commit on a branch with an open pull request fires
## this workflow twice and bills twice for the same answer -- see trivy.yml for
## the longer note. Branch work stays covered by `pull_request`, and the
## direct-to-master case by `push`.
##

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: reject invisible and confusable characters
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependencies: the checker is stdlib-only by design, so this job
      # stays fast and cannot break when a requirements pin moves.
      - name: Check tracked files for disallowed Unicode
        run: python scripts/check_unicode.py
