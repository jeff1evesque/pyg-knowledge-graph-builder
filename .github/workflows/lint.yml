name: lint

on:
  push:
  pull_request:

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned deliberately: an unpinned linter means a new upstream release
      # can turn an untouched branch red overnight. Bump this on purpose, so
      # the new findings land in a commit that is about the bump.
      - name: Install ruff
        run: pip install ruff==0.16.1

      # Rules and exclusions live in .ruff.toml, so this is byte-for-byte the
      # same check that .githooks/pre-commit runs locally -- CI never surprises
      # you with a rule the hook did not apply.
      - name: Lint
        run: ruff check --output-format=github .
