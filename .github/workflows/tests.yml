name: tests

# Runs the test suite on GitHub-hosted runners. The suite is built to run
# against a local SparkSession (no Spark cluster and no RAPIDS Accelerator are
# required), so a plain Ubuntu runner reproduces a local test run exactly.
#
# Two jobs:
#   unit — the fast unit suite (everything except the e2e marker).
#   e2e  — the end-to-end pipeline smoke test over small RDF fixtures. Heavier
#          (runs build_graph end to end), so it is isolated from fast feedback.
# Both install the same deps (requirements-test.txt already pins torch /
# torch-geometric / pyspark); the split is about runtime weight, not packages.
on:
  push:
  pull_request:

# A newer push to the same branch/PR cancels an in-progress run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pyspark 3.5 requires a JVM; Java 17 matches the local/runtime toolchain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run unit tests
        env:
          # Pin Spark's bind address so the local[*] driver comes up on runners
          # that don't resolve their own hostname.
          SPARK_LOCAL_IP: 127.0.0.1
        run: python -m pytest tests/ -q -m "not e2e"

  e2e:
    name: e2e pipeline smoke test
    runs-on: ubuntu-latest
    # Guard against a runaway/hung pipeline (default job timeout is 6h).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run e2e smoke test
        env:
          SPARK_LOCAL_IP: 127.0.0.1
          # spark.driver.memory is only honored at JVM launch, so raise the
          # driver heap here (the full pipeline needs more than the default 1 GB
          # even on tiny fixtures). Leaves headroom for Python/torch on a 7 GB
          # runner. Must end with `pyspark-shell`.
          PYSPARK_SUBMIT_ARGS: "--driver-memory 4g pyspark-shell"
        # -s streams Spark's live [Stage N] output (pytest captures by default,
        # which hid all progress); -rA shows a summary of every test outcome.
        run: python -m pytest tests/ -m e2e -s -rA
