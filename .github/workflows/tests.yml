name: tests

# Fast unit suite — runs on every push and PR, and drives the README badge.
# The heavier end-to-end pipeline smoke test is a separate, manual-only workflow
# (.github/workflows/e2e.yml); see the README "Testing" section for why.
#
# Runs against a local SparkSession (no cluster, no RAPIDS), so a stock
# ubuntu-latest runner (Java 17 + Python 3.12) reproduces a local run exactly.
##
## Push is scoped to the default branch. With a bare `push:` beside
## `pull_request:`, every commit on a branch with an open pull request fires
## this workflow twice and bills twice for the same answer -- see trivy.yml for
## the longer note. Branch work stays covered by `pull_request`, and the
## direct-to-master case by `push`.
##

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch/PR cancels an in-progress run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pyspark 3.5 requires a JVM; Java 17 matches the local/runtime toolchain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      # Install the CPU-only torch build BEFORE the requirements resolve.
      #
      # requirements.txt asks for a bare `torch>=2.5.0`, and on Linux the default
      # PyPI wheel for that is the CUDA build: ~921MB of torch plus ~2.9GB of
      # nvidia/* CUDA runtime libraries pulled in as its dependencies. This runner
      # has no GPU and the unit suite is CPU-only (local SparkSession, no RAPIDS),
      # so every byte of that is downloaded, unpacked and cached for nothing.
      #
      # Installing torch from the CPU wheel index first leaves `torch>=2.5.0`
      # already satisfied below, so pip never considers the CUDA wheel. Done as a
      # separate step rather than an --extra-index-url on the install below,
      # because with both indexes visible pip is free to pick either wheel (the
      # +cpu local-version suffix makes the comparison subtle) -- installing first
      # is unambiguous.
      #
      # This is CI-only. Developer machines and the cluster genuinely need the
      # CUDA build (GPU e2e suite, RAPIDS path) and are unaffected.
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run unit tests
        env:
          # Pin Spark's bind address so the local[*] driver comes up on runners
          # that don't resolve their own hostname.
          SPARK_LOCAL_IP: 127.0.0.1
        # TWO workers, and the number is a ceiling rather than a preference.
        #
        # A worker here is expensive twice over. Each one builds its own
        # session-scoped SparkSession, and tests/conftest.py asks for a 4g driver
        # heap, so two workers already reserve 8 GB of ceiling on a 16 GB runner.
        # Each session is local[2], so two workers also put four Spark threads on
        # the runner's four vCPU. Four workers would be 16 GB of heap ceiling and
        # eight threads: memory is what gives first, and it does not announce
        # itself -- see the note at tests/conftest.py:26, where a shared heap
        # produced ~150 failures that read as unrelated test breakage.
        #
        # bin/run_tests.sh's -n 8 is calibrated for a 20-core developer box and
        # does not belong here. If this run turns red with exit 137, or with
        # failures that look like nothing to do with the diff, drop the -n first.
        run: python -m pytest tests/ -q -m "not e2e" -n 2
