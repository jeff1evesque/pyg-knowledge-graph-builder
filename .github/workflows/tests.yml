name: tests

# Runs the unit-test suite on GitHub-hosted runners. The suite is built to run
# against a local SparkSession (no Spark cluster and no RAPIDS Accelerator are
# required), so a plain Ubuntu runner reproduces a local test run exactly.
on:
  push:
  pull_request:

# A newer push to the same branch/PR cancels an in-progress run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pyspark 3.5 requires a JVM; Java 17 matches the local/runtime toolchain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        env:
          # Pin Spark's bind address so the local[*] driver comes up on runners
          # that don't resolve their own hostname.
          SPARK_LOCAL_IP: 127.0.0.1
        run: python -m pytest tests/ -q
