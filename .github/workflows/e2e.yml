name: e2e (manual)

# End-to-end pipeline smoke test: runs the real build_graph over small RDF
# fixtures for ALL sources (incl. BLS). The enrichment fans out into ~1,300
# Spark stages regardless of data size, which is too heavy/slow for a stock
# runner on every push — so this is MANUAL-ONLY (workflow_dispatch). It may not
# complete on a 7 GB GitHub-hosted runner; prefer a larger/self-hosted runner,
# or run it locally (see the README "Testing" section).
on:
  workflow_dispatch:

jobs:
  e2e:
    name: e2e pipeline smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run e2e smoke test
        env:
          SPARK_LOCAL_IP: 127.0.0.1
          # spark.driver.memory is only honored at JVM launch (not in the builder).
          PYSPARK_SUBMIT_ARGS: "--driver-memory 4g pyspark-shell"
        # -s streams Spark's live [Stage N] output; -rA summarizes every outcome.
        run: python -m pytest tests/ -m e2e -s -rA
