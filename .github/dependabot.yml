##
## Dependency updates. Dependabot is a GitHub service rather than an Action --
## it needs no workflow, no runner and no CI minutes, and it never runs on a
## commit or a pull request. Version updates follow the weekly interval below;
## security updates fire independently, whenever an advisory lands that affects
## this repository.
##
## Dependabot opens the fix; the `trivy` workflow is what blocks on findings.
## Neither replaces the other.
##
version: 2
updates:

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      pip:
        patterns:
          - "*"

  ##
  ## The most commonly forgotten ecosystem, and the one that keeps third-party
  ## actions from silently drifting. Wanted in every repository that has a
  ## workflow at all.
  ##
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
