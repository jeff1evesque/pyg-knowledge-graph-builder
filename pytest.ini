[pytest]
# Silence dependency-INTERNAL warning noise only, scoped by emitting module so
# warnings from our own spark_jobs/tests code always surface. No blanket
# category ignores: a new deprecation in project code must stay visible.
filterwarnings =
    ignore::DeprecationWarning:pyspark\.sql\.pandas\.utils
    ignore::pandas.errors.Pandas4Warning:pyspark\.sql\.pandas\.types
    ignore::DeprecationWarning:torch\.jit\._script

markers =
    e2e: end-to-end pipeline smoke test over small RDF fixtures (heavier; runs in a separate CI job)
    cluster: submits the real job to a standalone Spark cluster (opt-in; needs SPARK_MASTER_URL and CLUSTER_SMOKE_SOURCE_PATH, so it is skipped in CI and on a laptop)
    launcher: runs one of the bin/ shell scripts for real against stub binaries -- a stub spark-submit, or stub ssh/scp/ping/pkill -- and asserts on what it emitted or did (needs bash, plus zip or flock depending on the script, but no Spark, GPU or cluster, so it runs in CI with the rest of the fast suite; the marker is for selecting it, not for skipping it)
