# Shared secret-scanning rules.
#
# Deliberately free of any real account id, bucket name or address: a config
# that names the secret it defends is itself the leak, replicated into every
# repository that adopts it. Every rule below matches a SHAPE in a context
# where that shape can only be the real thing.

title = "jefflevesque shared rules"

# Paths that are not authored source. Generated bundles, compiled artifacts and
# vendored trees restate their inputs in forms no reviewer reads, so a finding
# in one is a finding about the file it came from -- reported twice and fixed
# in neither. The source itself is still scanned.
[[allowlists]]
description = "generated, compiled and vendored files"
paths = [
  '''(?i)(^|/)(node_modules|vendor|__pycache__|\.venv|venv|\.mypy_cache|\.pytest_cache)/''',
  # vendored third-party packages: their example data is not our secret
  '''(?i)(^|/)(site-packages|botocore|boto3|s3transfer|jmespath|dateutil|urllib3|pip|setuptools|pkg_resources)/''',
  '''(?i)(^|/)(dist|build|out)/''',
  '''(?i)\.(min\.js|min\.css|map|pyc|lock)$''',
  '''(?i)(^|/)(package-lock\.json|yarn\.lock|poetry\.lock|Cargo\.lock)$''',
]

[extend]
# AWS keys, private keys, cloud provider tokens, github/slack/stripe tokens and
# ~150 other providers. Maintained upstream; the rules below are the ones this
# stack needs that upstream does not cover.
useDefault = true

# --------------------------------------------------------------------------- #
# AWS account identity
# --------------------------------------------------------------------------- #

[[rules]]
id = "aws-account-id"
description = "AWS account id in an ARN, console URL or an account assignment"
# Anchored on an AWS context. A bare 12-digit number is a timestamp, an order
# id or a phone number far more often than it is an account, and a rule that
# cannot tell the difference gets disabled within a week.
#
# The assignment anchor is 'account' with an OPTIONAL '_id' suffix. Anchoring on
# 'account_id' alone missed every one of these:
#
#     ACCOUNT=123456789012                              # a shell deploy script
#     env=cdk.Environment(account="123456789012", ...)  # cdk, python and ts
#     CDK_DEFAULT_ACCOUNT=123456789012                  # cdk, environment
#     "account=123456789012:region=us-east-1"           # cdk.context.json keys
#
# (the ids above are the documentation placeholder, so this file does not trip
#  its own rule)
#
# The '\b' that would normally precede 'account' is omitted on purpose: without
# it the alternation still matches inside CDK_DEFAULT_ACCOUNT, where the
# preceding '_' is a word character and a boundary therefore does not exist.
regex = '''(?i)(?:arn:aws[a-z-]*:[a-z0-9-]*:[a-z0-9-]*:|aws://|(?:aws[_-]?)?account(?:[_-]?id)?["'\s:=]{1,4})(\d{12})'''
secretGroup = 1
tags = ["aws", "account-id"]

[rules.allowlist]
# The placeholder every AWS document uses, and obvious dummies.
# The account ids AWS publishes in its own documentation and SDK examples.
# The vendored botocore tree in one repository restates them 1,826 times.
regexes = ['''(?:123456789012|012345678901|012345678910|111122223333|999999999999|000000000000|111111111111|222222222222|333333333333|444455556666|123456789011|098765432109|01234567\d{4})''']

# --------------------------------------------------------------------------- #
# AWS account identity, embedded in a hostname
# --------------------------------------------------------------------------- #

[[rules]]
id = "aws-account-id-host"
description = "AWS account id in an ECR registry or console sign-in hostname"
# A separate rule rather than another alternative in the one above, because the
# account sits BEFORE its anchor here rather than after it, and one rule cannot
# hold both orders while still reporting group 1 as the secret.
#
# These reach a repository through paths that have nothing to do with an SDK:
# an ECR image reference in a Dockerfile, a compose file, a k8s manifest or a
# workflow's `image:` key, and a console URL pasted into a runbook or a README.
regex = '''(?i)\b(\d{12})\.(?:dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com|signin\.aws\.amazon\.com)'''
secretGroup = 1
keywords = ["amazonaws.com", "aws.amazon.com"]
tags = ["aws", "account-id"]

[rules.allowlist]
# The same dummies the rule above allows; kept in step with it by hand, since
# gitleaks has no way to share one allowlist between two rules.
regexes = ['''(?:123456789012|012345678901|012345678910|111122223333|999999999999|000000000000|111111111111|222222222222|333333333333|444455556666|123456789011|098765432109|01234567\d{4})''']

# --------------------------------------------------------------------------- #
# AWS account identity, with no anchor at all
# --------------------------------------------------------------------------- #

[[rules]]
id = "aws-account-id-bare"
description = "12-digit number that could be an AWS account id, in any context"
# The two rules above need an AWS word beside the number. This one needs
# nothing, because the anchor is exactly what a careless paste drops: an
# account id copied into a test fixture arrives under whatever name the fixture
# already used, and generated test code is where this actually happens.
#
#     SECRET = '123456789012'               # the variable name says nothing
#     x = ['123456789012']                  # a json, yaml or csv value
#     my-artifacts-123456789012-us-east-1   # a bucket name
#     /var/log/123456789012/app.log         # a path
#     123456789012                          # alone on a line, in pasted output
#
# (the ids above are the documentation placeholder, so this file does not trip
#  its own rule)
#
# Deliberately OVERLAPS the anchored rules rather than replacing them. A line
# holding 'account=<id>' now reports twice, and that is the intended trade: the
# anchored id says WHY the number looked like an account, which is worth more
# at review time than one merged finding.
#
# What it costs: a phone number with a country code, a ledger or invoice id, a
# fixture emitting random digits. Measured at zero occurrences across this
# repository and its full history; '.gitleaksignore' is the release valve.
#
# No 'keywords' on purpose. Keywords are a PREFILTER -- gitleaks only runs the
# regex on content already containing one -- so any keyword here would restrict
# this rule to lines mentioning AWS, which is the exact anchor it exists to do
# without.
#
# '\b' both sides holds it to runs of EXACTLY 12, so a 13-digit millisecond
# timestamp does not match; unix seconds are 10 digits and fall outside too.
regex = '''\b(\d{12})\b'''
secretGroup = 1
tags = ["aws", "account-id"]

[rules.allowlist]
# Anchored with ^$, unlike the two copies above. With no AWS word required, the
# secret has to BE a dummy rather than merely contain one -- otherwise a real
# id holding '111111111111' inside it would be waived by the substring.
regexes = ['''^(?:123456789012|012345678901|012345678910|111122223333|999999999999|000000000000|111111111111|222222222222|333333333333|444455556666|123456789011|098765432109|01234567\d{4})$''']

# --------------------------------------------------------------------------- #
# AWS long-lived credentials, the secret half
# --------------------------------------------------------------------------- #

[[rules]]
id = "aws-secret-access-key"
description = "AWS secret access key or session token"
# 'aws-access-key-id' below matches the AKIA... identifier. This matches the
# 40-character secret that pairs with it, and the session token that arrives
# with temporary ASIA credentials.
#
# Both were missed entirely by the hook that reads this file, which implements
# the custom rules here plus private keys and had neither. In CI they were
# caught only incidentally by the bundled 'generic-api-key' -- the fuzziest
# rule gitleaks ships, and the first one anybody tunes when it gets noisy.
# Losing AWS secret coverage as a side effect of that tuning is not a risk
# worth carrying, so the coverage is explicit here.
#
# 'session' is spelled out because the 'oauth-refresh-token' rule below
# alternates on refresh|access|bearer|id and does not include it.
#
# No 'keywords': the prefilter matches literal substrings, and the spellings
# this accepts ('secret-access-key' as well as 'secret_access_key') have no
# single substring in common, so a keyword list would silently drop variants.
regex = '''(?i)\b(?:aws[_-]?)?(?:secret[_-]?access[_-]?key|session[_-]?token)["'\s:=]{1,6}["']?([A-Za-z0-9/+=]{40,})'''
secretGroup = 1
tags = ["aws", "secret-key"]

# --------------------------------------------------------------------------- #
# Long-lived OAuth material
# --------------------------------------------------------------------------- #

[[rules]]
id = "oauth-refresh-token"
description = "OAuth refresh or access token assigned to a variable"
# Refresh tokens are the highest-value secret in this stack: they are long
# lived, they are not rotated on deploy, and they buy an attacker the account
# rather than one request.
regex = '''(?i)\b(?:refresh|access|bearer|id)[_-]?token["'\s:=]{1,4}["']([A-Za-z0-9._\-+/]{24,})["']'''
secretGroup = 1
tags = ["oauth", "token"]

[rules.allowlist]
# A dotted module path is a HANDLER, not a token: this stack maps step names to
# lambda handlers in dicts keyed 'refresh_token', and the value is
# 'handlers.market_refresh_token.handler'. Matching the key name alone made the
# rule cry wolf on the first file it saw, which is how a scanner gets turned off.
regexes = [
  '''(?i)(?:REPLACE|EXAMPLE|PLACEHOLDER|DUMMY|FAKE|TEST|YOUR[_-]?|<[^>]+>|\$\{|os\.environ|getenv)''',
  '''^[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)+$''',
  '''(?i)handler''',
]
regexTarget = "match"

# --------------------------------------------------------------------------- #
# Credentials embedded in URLs
# --------------------------------------------------------------------------- #

[[rules]]
id = "url-basic-auth"
description = "username:password embedded in a URL"
# Proxy endpoints are the usual source: a rotating-proxy provider hands out
# http://user:pass@host:port and it goes straight into a config.
regex = '''(?i)\b(?:https?|socks5|ftp|mongodb|postgres(?:ql)?|redis|amqp)://[^\s:/@]{2,}:([^\s:/@]{4,})@'''
secretGroup = 1
tags = ["credentials", "url"]

[rules.allowlist]
# '{proxy_user}:{proxy_user_password}@' is an f-string TEMPLATE -- the secret is
# in a variable, which is the pattern we want people using. Flagging it would
# punish the correct code and teach everyone to ignore the scanner.
regexes = [
  '''(?i)(?:REPLACE|EXAMPLE|PLACEHOLDER|DUMMY|FAKE|REDACTED|\*\*\*|user:pass|username:pass|<[^>]+>|\$\{|%s)''',
  '''\{[A-Za-z_][A-Za-z0-9_]*\}''',
]

# --------------------------------------------------------------------------- #
# AWS long-lived credentials
# --------------------------------------------------------------------------- #

[[rules]]
id = "aws-access-key-id"
description = "AWS access key id"
# Explicit, despite `useDefault`. The bundled aws rules want the key ALONGSIDE
# a recognised assignment or its matching secret, so a bare
# `AKIA...` on its own line passes -- verified against 8.30. That is the single
# most damaging string that can enter these repositories, so it is matched on
# its own unmistakable shape: AKIA/ASIA/ABIA/ACCA plus 16 upper-case
# alphanumerics is not a value anything else produces.
regex = '''\b((?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16})\b'''
secretGroup = 1
keywords = ["AKIA", "ASIA", "ABIA", "ACCA"]
tags = ["aws", "access-key"]

[rules.allowlist]
# The key AWS itself prints in every code sample.
regexes = ['''AKIAIOSFODNN7EXAMPLE''']

# Shapes that cannot be a secret, whatever rule matched them. Kept as SHAPES
# rather than as a list of waived findings: waiving one file at a time is how an
# allowlist quietly becomes an inventory of real leaks nobody rechecks.
[[allowlists]]
description = "concatenation, interpolation and attribute access"
regexTarget = "line"
regexes = [
  # the value is assembled at runtime, so it is not in the file
  '''(?:\+\s*["'a-zA-Z_]|\$\{|\{\{|f["']|%s|%\(|\.format\(|\.join\()''',
  # an attribute, a module path or an environment read
  '''(?:this\.|self\.|os\.environ|getenv|process\.env|import\.meta\.env)''',
]

[[allowlists]]
description = "documentation and placeholders"
regexTarget = "line"
regexes = [
  '''(?i)(?:REPLACE|EXAMPLE|PLACEHOLDER|DUMMY|FAKE|REDACTED|SAMPLE|YOUR[_-]?|<[^>]{1,40}>)''',
]

[[allowlists]]
description = "values that are not secrets by construction"
# Narrow on purpose. Exempting COMMENTS wholesale would be easier and wrong: a
# key pasted into a comment is still a published key. These exempt the value's
# own shape instead.
regexTarget = "secret"
regexes = [
  # a filename -- documentation naming a file, not quoting a credential
  '''(?i)^[\w.-]+\.(xml|json|htm|html|csv|parquet|py|js|ts|md|ya?ml|txt|pdf|jpg|png|gz|zip|pt)$''',
  # the dummy passwords every documentation example uses
  '''(?i)^(?:password|passwd|pass|secret|changeme|hunter2|letmein|topsecret|s3cret)$''',
]

# --------------------------------------------------------------------------- #
# Repository-specific: this project must stay deployment-agnostic
# --------------------------------------------------------------------------- #

[[rules]]
id = "hardcoded-s3-bucket"
description = "Real S3 bucket name in code or documentation"
# Scoped to this repository on purpose. Naming a bucket is unavoidable in
# infrastructure code -- cloudformation names eight of them and has to -- but a
# graph builder that hard-codes one cannot be run against another dataset, and a
# README that names one publishes the deployment's storage layout to anybody who
# reads it.
#
# Matched only in a BUCKET context. The bare domain is not the pattern: it is
# also the RDF namespace authority for this whole ecosystem
# (https://<domain>/ontology/...), so a rule keyed on the domain flags every
# ontology term, including inside binary parquet fixtures.
#
# THE PROSE ANCHOR, and why it was added. Every anchor here used to be an
# ASSIGNMENT -- `Bucket = "..."`, `bucket_name = "..."`, a URI scheme. A real
# bucket name sat in this repository for months, and on the default branch,
# because it was written as documentation rather than as code:
#
#     bucket: S3 bucket name (e.g., "<a real bucket>")
#
# An Args: line in a docstring. No assignment, so no anchor, so no finding --
# from the local hook or from CI. A README sentence would have slipped through
# the same way, which is the case this rule was written to stop.
#
# The prose branch requires the quoted value to be HOSTNAME-SHAPED (dot-joined
# labels) before it fires. Without that lookahead it matched the `["Body"]` in
# `s3.get_object(Bucket=bucket, Key=key)["Body"]` and 68 other lines of ordinary
# code -- a rule that noisy gets switched off within a week, which would cost
# more than the hole it closed. Measured at zero false positives across authored
# source with the lookahead in place.
regex = '''(?i)(?:s3://|s3a://|arn:aws:s3:::|Bucket\s*=\s*["']|bucket_name\s*=\s*["']|https?://[a-z0-9.-]+\.s3[.-])([a-z0-9][a-z0-9.-]{2,62})'''
path = '''(?i)\.(py|md|ipynb|ya?ml|json|tf|sh|cfg|toml)$'''
secretGroup = 1
tags = ["aws", "s3", "portability"]

[rules.allowlist]
# Documentation placeholders. A README SHOULD show 's3://bucket/path' -- that is
# the correct way to document a path, and blocking it teaches people to write
# worse docs.
regexes = [
  '''(?i)(?://|:::|["'])(?:bucket|my-bucket|my-archive|my-data|my-data-lake|example|example-bucket|test|test-bucket|placeholder|your-bucket|some-bucket|sample|demo)(?:[/"'`\s]|$)''',
]
regexTarget = "match"

# --------------------------------------------------------------------------- #
# Repository-specific: a bucket name written as prose
# --------------------------------------------------------------------------- #

[[rules]]
id = "hardcoded-s3-bucket-prose"
description = "Real S3 bucket name written as documentation rather than as code"
# A SECOND rule rather than another alternative in 'hardcoded-s3-bucket', for
# two reasons. The value has a different shape here -- it must look like a
# hostname -- so it cannot share that rule's trailing capture group. And
# expressing "the quoted value must be hostname-shaped" inside one alternation
# needs a LOOKAHEAD, which RE2 does not have; gitleaks panics on one. See the
# note in scripts/check_secrets.py, which this rule is the reason for.
#
# WHAT IT CATCHES. Every anchor in the other rule is an ASSIGNMENT. A real
# bucket name sat on the default branch for months because it was written as
# prose instead:
#
#     bucket: S3 bucket name (e.g., "<a real bucket>")
#
# An Args: line in a docstring. No assignment, so no anchor, so no finding --
# from the local hook or from CI. A README sentence slips through identically.
# Worse than a comment, too: Python keeps a docstring as __doc__, so the value
# ships inside the built artifact and not only in the source.
#
# The value must be HOSTNAME-SHAPED (dot-joined labels) for this to fire. With
# any quoted value accepted it matched the `["Body"]` in
# `s3.get_object(Bucket=bucket, Key=key)["Body"]` and 68 other lines of
# ordinary code -- a rule that noisy gets switched off within a week, which
# costs more than the hole it closes. As written: zero false positives across
# authored source.
regex = '''(?i)bucket[^"'\n]{0,40}["']([a-z0-9][a-z0-9-]*(?:\.[a-z0-9-]+)+)["']'''
path = '''(?i)\.(py|md|ipynb|ya?ml|json|tf|sh|cfg|toml)$'''
secretGroup = 1
tags = ["aws", "s3", "portability"]

[rules.allowlist]
# Placeholders a README should still be able to write, and the RFC 2606
# documentation domains.
regexes = [
  '''(?i)^(?:bucket|my-bucket|my-archive|my-data|my-data-lake|example|example-bucket|test|test-bucket|placeholder|your-bucket|some-bucket|sample|demo)\.''',
  '''(?i)(?:^|\.)(?:example\.(?:com|org|net|edu)|localhost|invalid)$''',
]
